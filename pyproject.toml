[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "foxstar-agent"
version = "0.1.0"
description = "Conversation agent with routing, tools, scheduling, skills and optional WeChat integration"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31,<3",
    "openai>=1.70,<3",
    "httpx>=0.27,<1",
    "pypdf>=4",
    "python-docx>=1.1",
    "PyYAML>=6",
    "python-dotenv>=1",
    "openpyxl>=3.1",
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
test = ["pytest>=8", "fastapi>=0.115", "httpx>=0.27,<1"]
api = ["fastapi>=0.115", "uvicorn>=0.30"]
code = ["daytona>=0.20", "opentelemetry-api==1.41.0", "opentelemetry-sdk==1.41.0"]

[project.scripts]
foxstar-agent = "foxstar_bot.app:main"

[tool.setuptools]
packages = ["foxstar_bot"]
include-package-data = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

