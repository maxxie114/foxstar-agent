[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "foxstar-agent"
version = "0.1.0"
description = "Public research, memory and orchestration components of FoxStar Agent"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31,<3",
    "openai>=1.70,<3",
    "httpx>=0.27,<1",
    "pypdf>=4",
    "python-docx>=1.1",
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["foxstar_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

