<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img" aria-labelledby="title desc">
  <title id="title">FoxStar 微信机器人运行时架构图</title>
  <desc id="desc">展示微信机器人当前运行时主流程，包括接入、路由、reply gate、testing mode、工具、技能、存储与日志。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101820"/>
      <stop offset="48%" stop-color="#18222B"/>
      <stop offset="100%" stop-color="#0E151B"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1D7A8C"/>
      <stop offset="100%" stop-color="#204A5C"/>
    </linearGradient>
    <linearGradient id="model" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7B3F98"/>
      <stop offset="100%" stop-color="#3D5C9A"/>
    </linearGradient>
    <linearGradient id="tool" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#257D52"/>
      <stop offset="100%" stop-color="#315D6F"/>
    </linearGradient>
    <linearGradient id="store" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8C6A2A"/>
      <stop offset="100%" stop-color="#65533A"/>
    </linearGradient>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#D8E7EA"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8BE0C2"/>
    </marker>
    <style>
      .title { font: 800 46px "Microsoft YaHei", "Segoe UI", Arial, sans-serif; fill: #F4FBFF; letter-spacing: 0; }
      .subtitle { font: 500 20px "Microsoft YaHei", "Segoe UI", Arial, sans-serif; fill: #B9CDD4; letter-spacing: 0; }
      .section { font: 800 18px "Microsoft YaHei", "Segoe UI", Arial, sans-serif; fill: #EAF6F8; letter-spacing: .5px; }
      .box-title { font: 800 24px "Microsoft YaHei", "Segoe UI", Arial, sans-serif; fill: #FFFFFF; letter-spacing: 0; }
      .box-text { font: 500 17px "Microsoft YaHei", "Segoe UI", Arial, sans-serif; fill: #DCEBEE; letter-spacing: 0; }
      .small { font: 500 15px "Microsoft YaHei", "Segoe UI", Arial, sans-serif; fill: #C3D4DA; letter-spacing: 0; }
      .pill { font: 800 14px "Microsoft YaHei", "Segoe UI", Arial, sans-serif; fill: #0B1116; letter-spacing: .3px; }
      .box { rx: 8; ry: 8; filter: url(#shadow); stroke: rgba(255,255,255,.18); stroke-width: 1.2; }
      .thinBox { rx: 8; ry: 8; fill: rgba(255,255,255,.06); stroke: rgba(255,255,255,.16); stroke-width: 1.1; }
      .dashed { rx: 8; ry: 8; fill: rgba(139,224,194,.06); stroke: #8BE0C2; stroke-width: 1.4; stroke-dasharray: 8 7; }
      .arrow { fill: none; stroke: #D8E7EA; stroke-width: 3; marker-end: url(#arrow); }
      .arrow2 { fill: none; stroke: #8BE0C2; stroke-width: 3; marker-end: url(#arrowAccent); }
      .mutedArrow { fill: none; stroke: rgba(216,231,234,.45); stroke-width: 2.4; marker-end: url(#arrow); }
      .lane { fill: rgba(255,255,255,.035); stroke: rgba(255,255,255,.09); stroke-width: 1; rx: 8; ry: 8; }
    </style>
  </defs>

  <rect width="1800" height="1200" fill="url(#bg)"/>
  <path d="M0 160 C300 90 460 220 720 145 C1020 60 1240 145 1800 80 L1800 0 L0 0 Z" fill="#1C3D46" opacity=".32"/>
  <path d="M0 1060 C280 980 520 1120 820 1030 C1080 950 1320 1070 1800 990 L1800 1200 L0 1200 Z" fill="#342B4A" opacity=".28"/>

  <text x="70" y="78" class="title">FoxStar 微信机器人运行时架构</text>
  <text x="72" y="112" class="subtitle">一个带 reply gate、testing mode、定时任务、游戏会话、记账、本地工具与多 provider 编排的微信机器人</text>

  <rect x="58" y="145" width="1684" height="138" class="lane"/>
  <text x="82" y="178" class="section">1. 微信消息接入与运行时闸门</text>

  <rect x="90" y="198" width="210" height="58" class="box" fill="#315C72"/>
  <text x="114" y="223" class="box-title">微信群</text>
  <text x="114" y="246" class="box-text">文字、图片、文件、引用</text>

  <rect x="365" y="190" width="230" height="74" class="box" fill="url(#core)"/>
  <text x="389" y="218" class="box-title">WeChatFerry</text>
  <text x="389" y="243" class="box-text">WCF 适配层 + PC 微信</text>

  <rect x="660" y="190" width="245" height="74" class="box" fill="#315C72"/>
  <text x="684" y="218" class="box-title">优先级队列</text>
  <text x="684" y="243" class="box-text">白名单优先，worker 池</text>

  <rect x="970" y="190" width="280" height="74" class="box" fill="#4F5F66"/>
  <text x="994" y="218" class="box-title">状态记录</text>
  <text x="994" y="243" class="box-text">聊天、昵称、事件、成员快照</text>

  <rect x="1315" y="190" width="345" height="74" class="box" fill="#673C4A"/>
  <text x="1339" y="218" class="box-title">全局关闭模式</text>
  <text x="1339" y="243" class="box-text">只听不回，不发 API 请求</text>

  <path class="arrow" d="M300 227 L356 227"/>
  <path class="arrow" d="M595 227 L651 227"/>
  <path class="arrow" d="M905 227 L961 227"/>
  <path class="mutedArrow" d="M1250 227 L1306 227"/>

  <rect x="58" y="315" width="1684" height="352" class="lane"/>
  <text x="82" y="348" class="section">2. 路由层、指令层、策略层与主模型</text>

  <rect x="90" y="382" width="280" height="150" class="box" fill="url(#core)"/>
  <text x="118" y="414" class="box-title">消息路由器</text>
  <text x="118" y="447" class="box-text">解析微信引用 XML</text>
  <text x="118" y="473" class="box-text">识别 @ / 直接回复模式</text>
  <text x="118" y="499" class="box-text">分流图片、文件、网页请求</text>

  <rect x="90" y="552" width="280" height="72" class="thinBox"/>
  <text x="118" y="582" class="box-title">权限层</text>
  <text x="118" y="606" class="box-text">白名单、黑名单、Owner、目标名单</text>

  <rect x="455" y="362" width="300" height="110" class="box" fill="#3D5864"/>
  <text x="482" y="394" class="box-title">指令处理器</text>
  <text x="482" y="427" class="box-text">/set /gset /model /reasoning</text>
  <text x="482" y="452" class="box-text">/schedule /game /fortune /accounting</text>

  <rect x="455" y="500" width="300" height="124" class="box" fill="#47504B"/>
  <text x="482" y="532" class="box-title">每群独立设置</text>
  <text x="482" y="565" class="box-text">reply gate、冷却、延迟</text>
  <text x="482" y="591" class="box-text">模型、testing mode、工具、长度</text>

  <rect x="835" y="362" width="295" height="118" class="box" fill="#5B4E2B"/>
  <text x="864" y="394" class="box-title">Reply Gate</text>
  <text x="864" y="427" class="box-text">配置 judge 模型：REPLY / PASS</text>
  <text x="864" y="453" class="box-text">社交快速路径与自动插话</text>

  <rect x="835" y="512" width="295" height="112" class="box" fill="#643843"/>
  <text x="864" y="544" class="box-title">运行时闸门</text>
  <text x="864" y="577" class="box-text">冷却、direct mode、active game</text>
  <text x="864" y="603" class="box-text">testing mode 绕过 prompt 组装</text>

  <rect x="1210" y="358" width="360" height="162" class="box" fill="url(#model)"/>
  <text x="1240" y="392" class="box-title">主模型编排层</text>
  <text x="1240" y="426" class="box-text">按群选择 provider / model</text>
  <text x="1240" y="452" class="box-text">OpenAI、OpenRouter、DeepSeek、Together、MiniMax</text>
  <text x="1240" y="478" class="box-text">reasoning 归一化与 timeout fallback</text>

  <rect x="1210" y="544" width="360" height="80" class="thinBox"/>
  <text x="1240" y="575" class="box-title">Testing Mode</text>
  <text x="1240" y="600" class="box-text">只看当前一条消息，无 prompt / tools / history</text>

  <path class="arrow" d="M230 264 L230 373"/>
  <path class="arrow" d="M370 457 L446 417"/>
  <path class="arrow" d="M370 492 L446 556"/>
  <path class="arrow" d="M755 417 L826 417"/>
  <path class="arrow" d="M982 480 L982 503"/>
  <path class="arrow" d="M1130 568 C1160 568 1170 439 1201 439"/>
  <path class="arrow2" d="M1130 421 L1201 421"/>
  <path class="mutedArrow" d="M1378 520 L1378 535"/>

  <rect x="58" y="700" width="805" height="408" class="lane"/>
  <text x="82" y="733" class="section">3. 上下文、记忆、存储与日志</text>

  <rect x="90" y="770" width="335" height="118" class="box" fill="url(#store)"/>
  <text x="118" y="802" class="box-title">上下文窗口</text>
  <text x="118" y="836" class="box-text">最近上下文 + 压缩历史</text>
  <text x="118" y="862" class="box-text">timeout 污染消息抑制</text>

  <rect x="90" y="920" width="335" height="118" class="box" fill="url(#store)"/>
  <text x="118" y="952" class="box-title">长期记忆系统</text>
  <text x="118" y="986" class="box-text">Master Memory / User Memory</text>
  <text x="118" y="1012" class="box-text">每群独立，带优先级</text>

  <rect x="485" y="770" width="330" height="118" class="box" fill="#6C5B34"/>
  <text x="513" y="802" class="box-title">知识库 + 技能系统</text>
  <text x="513" y="836" class="box-text">knowledge.md 与本地 skill registry</text>
  <text x="513" y="862" class="box-text">用户自备知识库、prompt 和 helper file</text>

  <rect x="485" y="920" width="330" height="118" class="box" fill="#4F5F66"/>
  <text x="513" y="952" class="box-title">SQLite 与专用日志</text>
  <text x="513" y="986" class="box-text">设置、记忆、定时任务、记账</text>
  <text x="513" y="1012" class="box-text">reply-gate、tool-trace、game、testing、error</text>

  <path class="arrow2" d="M425 829 L476 829"/>
  <path class="arrow2" d="M425 979 L476 979"/>
  <path class="mutedArrow" d="M650 770 C650 682 1240 652 1320 624"/>

  <rect x="897" y="700" width="845" height="408" class="lane"/>
  <text x="921" y="733" class="section">4. 当前运行时工具与本地模块</text>

  <rect x="930" y="768" width="250" height="102" class="box" fill="url(#tool)"/>
  <text x="956" y="799" class="box-title">市场与研究</text>
  <text x="956" y="833" class="box-text">行情、技术指标、联网研究</text>
  <text x="956" y="856" class="small">财经能力对非白名单默认隐藏</text>

  <rect x="1220" y="768" width="250" height="102" class="box" fill="url(#tool)"/>
  <text x="1246" y="799" class="box-title">知识库与技能</text>
  <text x="1246" y="833" class="box-text">knowledge lookup、discover_skills、load_skill</text>
  <text x="1246" y="856" class="small">本地 prompt 与 helper file</text>

  <rect x="1510" y="768" width="190" height="102" class="box" fill="url(#tool)"/>
  <text x="1536" y="799" class="box-title">天气</text>
  <text x="1536" y="833" class="box-text">Open-Meteo 查询</text>
  <text x="1536" y="856" class="small">不需 API key</text>

  <rect x="930" y="910" width="250" height="102" class="box" fill="url(#tool)"/>
  <text x="956" y="941" class="box-title">运势与游戏</text>
  <text x="956" y="975" class="box-text">运势、灯谜、脑筋急转弯、成语接龙</text>
  <text x="956" y="998" class="small">GM 会话、计分板、排行榜</text>

  <rect x="1220" y="910" width="250" height="102" class="box" fill="url(#tool)"/>
  <text x="1246" y="941" class="box-title">记账与定时任务</text>
  <text x="1246" y="975" class="box-text">支出 / 欠款记录，定时执行</text>
  <text x="1246" y="998" class="small">SQLite 持久化查询与导出</text>

  <rect x="1510" y="910" width="190" height="102" class="box" fill="#653E70"/>
  <text x="1536" y="941" class="box-title">代码执行</text>
  <text x="1536" y="975" class="box-text">Daytona Python 沙箱</text>
  <text x="1536" y="998" class="small">重试保护与 timeout 抑制</text>

  <rect x="930" y="1040" width="770" height="44" class="dashed"/>
  <text x="958" y="1068" class="box-text">同时存在：成员快照 diff、新人欢迎、社交问候快速路径，以及 可配置的 timeout fallback。</text>

  <path class="arrow2" d="M1390 624 C1390 684 1055 707 1055 759"/>
  <path class="arrow2" d="M1390 624 C1390 684 1345 707 1345 759"/>
  <path class="arrow2" d="M1390 624 C1390 686 1605 707 1605 759"/>
  <path class="arrow2" d="M1390 624 C1390 808 1055 820 1055 901"/>
  <path class="arrow2" d="M1390 624 C1390 808 1345 820 1345 901"/>
  <path class="arrow2" d="M1390 624 C1390 808 1605 820 1605 901"/>

  <rect x="1160" y="170" width="72" height="28" rx="8" fill="#8BE0C2"/>
  <text x="1176" y="190" class="pill">自动</text>
  <rect x="1480" y="328" width="92" height="28" rx="8" fill="#F0C66D"/>
  <text x="1497" y="348" class="pill">工具调用</text>
  <rect x="711" y="744" width="104" height="28" rx="8" fill="#8BE0C2"/>
  <text x="727" y="764" class="pill">状态层</text>
  <rect x="1547" y="1018" width="153" height="28" rx="8" fill="#F0C66D"/>
  <text x="1564" y="1038" class="pill">当前能力</text>

  <path class="arrow" d="M1570 439 C1640 439 1655 620 1610 768"/>
  <path class="arrow" d="M1210 439 C1135 672 800 673 650 770"/>

  <rect x="70" y="1130" width="1660" height="38" rx="8" fill="rgba(255,255,255,.07)" stroke="rgba(255,255,255,.12)"/>
  <text x="92" y="1155" class="small">运行逻辑：接入层和策略层先决定是否接话；主模型按每群设置运行；本地工具与技能承担能力扩展；SQLite 记录状态；专用日志负责观测 reply gate、工具链、testing mode 和游戏会话。</text>
</svg>
